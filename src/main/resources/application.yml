logging:
  level:
    org.springframework.jdbc: info
    org.springframework.web: info
    com.broadcom.springconsulting.springnotes: debug

spring:
  application:
    name: spring-notes
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Only /chat is async today. The Spring default (~30s) can be shorter than a real
      # generation; 60s is a local/default ceiling, not a production guarantee - see the
      # gitops write-up for the matching Envoy timeout action item.
      request-timeout: 60000
  ai:
    ollama:
      chat:
        # Deploy-time default - override via SPRING_AI_OLLAMA_CHAT_MODEL for the real Ollama
        # instance. Not model-quality-critical: read-only Q&A grounded in retrieved note
        # content favors faithfulness over raw capability.
        model: qwen2.5:7b-instruct
        # Deliberately no options.keep-alive here. The embedding model can't have one set at
        # all - confirmed via Spring AI 2.0.0 bytecode that OllamaEmbeddingModel.mergeOptions()
        # only copies fields declared on the generic EmbeddingOptions interface when building
        # per-call options, and PgVectorStore always calls embed() with a non-null
        # EmbeddingOptions, so an Ollama-specific field like keep-alive never survives that
        # merge - it would be silently ineffective no matter what it's set to. Setting one only
        # for chat would then make chat evict on its own schedule while embedding follows
        # whatever Ollama's server-side default is, which is worse than picking one authority.
        # The actual deployment sets OLLAMA_KEEP_ALIVE=-1 server-side (never unload) on the
        # Ollama instance itself, which already governs both models consistently without any
        # app-level involvement - leave it there rather than fight it from here.
      embedding:
        # Overridable via SPRING_AI_OLLAMA_EMBEDDING_MODEL, but unlike the chat model this one
        # is NOT freely swappable later - its output dimension is baked into vector_store's
        # embedding vector(768) column at migration time (db/changelog/chat/db.changelog-chat-002.yaml).
        # Changing it means a schema migration plus a full reindex of every note.
        model: nomic-embed-text
    vectorstore:
      pgvector:
        # Liquibase owns the vector_store schema (db/changelog/chat/) - don't let
        # PgVectorStore create/alter it itself.
        initialize-schema: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, sbom
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: http://alloy.observability.svc.cluster.local:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://alloy.observability.svc.cluster.local:4318/v1/metrics
        step: 1m
  tracing:
    sampling:
      probability: 1.0
