logging:
  level:
    org.springframework.jdbc: info
    org.springframework.web: info
    com.broadcom.springconsulting.springnotes: debug

spring:
  application:
    name: spring-notes
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Only /chat is async today. The Spring default (~30s) can be shorter than a real
      # generation; 60s is a local/default ceiling, not a production guarantee - see the
      # gitops write-up for the matching Envoy timeout action item.
      request-timeout: 60000
  ai:
    ollama:
      chat:
        # Deploy-time default - override via SPRING_AI_OLLAMA_CHAT_MODEL for the real Ollama
        # instance. Not model-quality-critical: read-only Q&A grounded in retrieved note
        # content favors faithfulness over raw capability.
        model: qwen2.5:7b-instruct
        options:
          # Ollama's own default is 5m, which for a low-traffic app means the model is likely
          # evicted between chat sessions - 30m trades some idle host memory for avoiding a
          # cold-reload delay on the next request.
          keep-alive: 30m
      embedding:
        # Overridable via SPRING_AI_OLLAMA_EMBEDDING_MODEL, but unlike the chat model this one
        # is NOT freely swappable later - its output dimension is baked into vector_store's
        # embedding vector(768) column at migration time (db/changelog/chat/db.changelog-chat-002.yaml).
        # Changing it means a schema migration plus a full reindex of every note.
        model: nomic-embed-text
        # No embedding.options.keep-alive here on purpose - it would be silently ineffective.
        # OllamaEmbeddingModel.mergeOptions() only copies fields declared on the generic
        # EmbeddingOptions interface (model, dimensions, ...) when building per-call options,
        # and PgVectorStore always calls embed() with a non-null (if empty) EmbeddingOptions -
        # so keep-alive, being Ollama-specific and not on that interface, never survives the
        # merge (confirmed against Spring AI 2.0.0 bytecode; every embed call ends up on
        # Ollama's own 5m server default regardless of this property). If the embedding model
        # also needs to stay warm, set OLLAMA_KEEP_ALIVE as a server-side env var on the Ollama
        # deployment itself instead - that changes Ollama's own default for any request that
        # doesn't explicitly override it, which includes ours.
    vectorstore:
      pgvector:
        # Liquibase owns the vector_store schema (db/changelog/chat/) - don't let
        # PgVectorStore create/alter it itself.
        initialize-schema: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, sbom
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: http://alloy.observability.svc.cluster.local:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://alloy.observability.svc.cluster.local:4318/v1/metrics
        step: 1m
  tracing:
    sampling:
      probability: 1.0
