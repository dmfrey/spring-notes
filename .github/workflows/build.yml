name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Extra tag to push the built image under (e.g. v3.1.0) - for backfilling a release image when the automatic tag-triggered build was skipped'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run tests
        run: ./gradlew test

      - name: Upload Java coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: java-coverage-report
          path: build/reports/jacoco/test/html/

      - name: Java coverage summary
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        if: always()
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend Coverage Report
          comment-type: both

      - name: Java test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: Java Tests
          path: build/test-results/test/*.xml
          reporter: java-junit

  build-native-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    # AOT processing starts the application context which triggers Liquibase,
    # so a real database is required during the native image build.
    # The JWT issuer URI must also be set so Spring Boot's JwtDecoder
    # auto-configuration is included in the AOT-compiled native image.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: spring_notes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/spring_notes
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.dmfrey.com/application/o/spring-notes/
        run: |
          ./gradlew bootBuildImage \
            --no-build-cache \
            --imageName=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --publishImage \
            -PregistryUrl=https://ghcr.io \
            -PregistryUsername=${{ github.actor }} \
            -PregistryPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        env:
          EXTRA_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker pull ${IMAGE}:${{ github.sha }}
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:${{ github.ref_name }}
            docker push ${IMAGE}:${{ github.ref_name }}
          elif [[ -n "${EXTRA_TAG}" ]]; then
            docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:${EXTRA_TAG}
            docker push ${IMAGE}:${EXTRA_TAG}
          fi

  sbom-submit:
    # Dependency-Track is only reachable at a cluster-internal DNS name
    # (dependency-track-api.security.svc.cluster.local), so this runs on the
    # self-hosted runner living in the cluster rather than ubuntu-latest.
    runs-on: spring-notes-runner
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom

      - name: Upload SBOM to Dependency-Track
        id: upload
        env:
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf -X POST \
            http://dependency-track-api.security.svc.cluster.local:8080/api/v1/bom \
            -H "X-API-Key: ${DEPENDENCY_TRACK_API_KEY}" \
            -F "project=66ca30fd-78af-4ffd-8a55-5cc5109d2d26" \
            -F "bom=@build/reports/cyclonedx/application.cdx.json" | jq -r '.token')
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Wait for Dependency-Track to finish processing
        env:
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          TOKEN: ${{ steps.upload.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Dependency-Track didn't return an upload token - the upload likely failed silently."
            exit 1
          fi
          for i in $(seq 1 30); do
            PROCESSING=$(curl -sSf \
              -H "X-API-Key: ${DEPENDENCY_TRACK_API_KEY}" \
              "http://dependency-track-api.security.svc.cluster.local:8080/api/v1/bom/token/${TOKEN}" \
              | jq -r '.processing')
            if [ "$PROCESSING" = "false" ]; then
              echo "Processing complete."
              exit 0
            fi
            echo "Still processing (attempt $i/30)..."
            sleep 5
          done
          echo "::warning::Dependency-Track did not finish processing within 150s; findings below may be stale."

      - name: Fetch findings and gate on severity
        env:
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          set -euo pipefail
          curl -sSf \
            -H "X-API-Key: ${DEPENDENCY_TRACK_API_KEY}" \
            "http://dependency-track-api.security.svc.cluster.local:8080/api/v1/finding/project/66ca30fd-78af-4ffd-8a55-5cc5109d2d26" \
            -o findings.json

          {
            echo "## Dependency-Track findings"
            echo
            echo "| Severity | Vulnerability | Component |"
            echo "|---|---|---|"
            jq -r '.[] | [.vulnerability.severity, .vulnerability.vulnId, (.components[0].name + "@" + (.components[0].version // "?"))] | "| \(.[0]) | \(.[1]) | \(.[2]) |"' findings.json | sort
          } >> "$GITHUB_STEP_SUMMARY"

          CRITICAL=$(jq '[.[] | select(.vulnerability.severity == "CRITICAL")] | length' findings.json)
          HIGH=$(jq '[.[] | select(.vulnerability.severity == "HIGH")] | length' findings.json)

          echo "Critical: $CRITICAL, High: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL CRITICAL finding(s) - failing the build."
            exit 1
          fi
