name: OpenRewrite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Mondays at 08:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The default GITHUB_TOKEN can't be used here: pushes/PRs it creates never trigger other
      # workflow runs (GitHub's anti-recursion rule), so `test`/`build-native-image` silently
      # never ran on any OpenRewrite PR. Same GitHub App already used by renovate.yml sidesteps
      # that restriction.
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          token: "${{ steps.app-token.outputs.token }}"

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run OpenRewrite
        run: ./gradlew rewriteRun

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: apply OpenRewrite Spring recipes'
          branch: openrewrite/automated-spring-recipes
          delete-branch: true
          title: 'chore: OpenRewrite automated Spring recipe suggestions'
          body: |
            ## OpenRewrite automated changes

            This PR was created automatically by the [OpenRewrite](https://docs.openrewrite.org/) workflow.

            ### Active recipes
            - `SpringBoot33BestPractices` — enforces idiomatic Spring Boot 3/4 code patterns
            - `NoAutowiredOnConstructor` — removes redundant `@Autowired` on single constructors

            ### Review guidance
            - Each commit corresponds to one recipe's changes
            - Changes are purely mechanical; no logic is altered
            - Review, adjust if needed, then merge to apply

            ---
            *Generated by `./gradlew rewriteRun` — [OpenRewrite docs](https://docs.openrewrite.org/)*
          labels: dependencies,automated