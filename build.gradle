import org.springframework.boot.gradle.tasks.aot.ProcessAot

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '1.1.14'
	id 'org.cyclonedx.bom' version '3.4.1'
	id 'org.openrewrite.rewrite' version '7.39.0'
}

group = 'com.broadcom.springconsulting'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('datasourceMicrometerVersion', "2.3.0")
	set('springAiVersion', "2.0.1")

	// Security overrides for Critical/High findings from Dependency-Track's 2026-09-14 SBOM scan -
	// bump past Spring Boot 4.1.1's managed versions ahead of its next patch release. Remove each
	// once spring-boot-dependencies picks up a fixed version on its own.
	//
	// (The previous logback/netty/postgresql overrides pinned here for CVE-2026-13006,
	// CVE-2026-59901, and CVE-2026-54291 were removed 2026-09-14: Spring Boot 4.1.1's BOM now
	// manages logback 1.5.38, netty 4.2.17.Final, and postgresql 42.7.13 - all past those fixes.)
	set('tomcat.version', '11.0.25')            // CVE-2026-65905/65182/68525/65927: DIGEST replay, path-constraint & FORM auth bypass, rewrite valve off-by-one
	set('rabbit-amqp-client.version', '5.35.0') // CVE-2026-69220/63337 (+ unbounded-recursion/OOM ValueReader findings): DoS and unsafe Class.forName in JSON-RPC
	set('jackson-2-bom.version', '2.22.2')      // CVE-2026-68497: XML datatype deserializer (Duration/XMLGregorianCalendar) quadratic-time DoS
	set('jackson-bom.version', '3.2.2')         // CVE-2026-68497/68498: same XML datatype DoS, plus jackson-core uncontrolled resource consumption
}

dependencies {

	implementation 'com.github.f4b6a3:uuid-creator:6.1.1'

	// Spring Boot dependencies
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Observability dependencies
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'net.ttddyy.observation:datasource-micrometer-opentelemetry'
	implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Database dependencies
	implementation 'org.postgresql:postgresql'

	// AI dependencies - chat feature (see plan at /home/dmfrey/.claude/plans/nested-discovering-nova.md)
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

	// Developer Tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-grafana'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testImplementation 'org.testcontainers:ollama:1.21.4'
	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	rewrite 'org.openrewrite.recipe:rewrite-spring:6.37.1'
	rewrite 'org.openrewrite.recipe:rewrite-java-dependencies:1.60.2'
}

rewrite {
	// SpringBoot33BestPractices dropped: it deterministically suggests adding
	// javax.xml.bind:jaxb-api (a pre-Jakarta JDK-8-era JAXB shim) on every run, unrelated to
	// this Java 25 / Jackson-only codebase - not a real recommendation, just a stale
	// false-positive. See PRs #63 and #66.
	activeRecipe(
		'org.openrewrite.java.spring.NoAutowiredOnConstructor'
	)
}

tasks.cyclonedxDirectBom {
	// The `rewrite` configuration (OpenRewrite's own recipe engine, declared above) pulls in
	// Jackson 2.x as a build-tool-only dependency - it's never shipped in the app or the native
	// image. Left unscanned, Dependency-Track flags it as if it were a runtime component.
	skipConfigs = [ 'rewrite' ]
}

dependencyManagement {
	imports {
		mavenBom "net.ttddyy.observation:datasource-micrometer-bom:${datasourceMicrometerVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

bootBuildImage {
	docker {
		// Rootless Podman has no /var/run/docker.sock, so the plugin must bind the
		// DOCKER_HOST socket it resolves into the lifecycle containers instead of
		// defaulting to that hardcoded path (default: false, which breaks Podman).
		bindHostToBuilder = true
		publishRegistry {
			url = findProperty('registryUrl') ?: 'https://ghcr.io'
			username = findProperty('registryUsername') ?: ''
			password = findProperty('registryPassword') ?: ''
		}
	}
}

tasks.withType(ProcessAot).configureEach {
	// AOT processing starts the full application context, which triggers
	// Liquibase — requiring a real database. The datasource is configured in
	// application.yaml via ${SPRING_DATASOURCE_*} env-var substitution.
	// In CI, a postgres service container provides the database.
	// Locally these fall back to the compose.yaml database.
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	testLogging {
		exceptionFormat = 'full'
		showCauses = true
		showExceptions = true
		showStackTraces = true
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
